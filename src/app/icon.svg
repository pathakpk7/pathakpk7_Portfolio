<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Prasoon Pathak Dark Green Portfolio Icon</title>
  <desc id="desc">Minimal PP monogram in black and dark green with subtle circuit details.</desc>

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B5D3B"/>
      <stop offset="55%" stop-color="#0F7A4D"/>
      <stop offset="100%" stop-color="#18A66A"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black badge -->
  <circle cx="256" cy="256" r="228" fill="#050807"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#10251C" stroke-width="4"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#green)" stroke-width="7"/>

  <!-- Minimal circuit nodes -->
  <g fill="url(#green)" filter="url(#softGlow)">
    <circle cx="108" cy="142" r="6"/>
    <circle cx="404" cy="142" r="6"/>
    <circle cx="108" cy="370" r="6"/>
    <circle cx="404" cy="370" r="6"/>
  </g>

  <g fill="none" stroke="#0F7A4D" stroke-width="4" stroke-linecap="round">
    <path d="M108 142h38l18-18"/>
    <path d="M404 142h-38l-18-18"/>
    <path d="M108 370h38l18 18"/>
    <path d="M404 370h-38l-18 18"/>
  </g>

  <!-- PP monogram -->
  <g fill="none" stroke="url(#green)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round">
    <!-- First P -->
    <path d="M150 365V147"/>
    <path d="M150 160h78c46 0 70 23 70 62s-24 62-70 62h-78"/>

    <!-- Second P -->
    <path d="M284 365V242"/>
    <path d="M284 252h42c32 0 49 16 49 39s-17 39-49 39h-42"/>
  </g>

  <!-- Small terminal-style marks -->
  <g fill="#0F7A4D">
    <rect x="91" y="215" width="10" height="28" rx="3"/>
    <rect x="411" y="269" width="10" height="28" rx="3"/>
  </g>
</svg>